name: PR Databricks Job Lifecycle

on:
  pull_request:
    branches:
      - main

jobs:
  pr-databricks-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Create Databricks Job
        id: create_job
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "name": "PR-Job-${{ github.event.number }}",
                  "new_cluster": {
                      "spark_version": "13.2.x-scala2.12",
                      "node_type_id": "i3.xlarge",
                      "num_workers": 1
                  },
                  "notebook_task": {
                      "notebook_path": "/Workspace/Users/tushitasingh24@gmail.com/Databricks-e2e-project/trial_github"
                  }
                }' \
            ${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/create)
          
          JOB_ID=$(echo $RESPONSE | jq -r '.job_id')
          echo "job_id=$JOB_ID" >> $GITHUB_ENV
          echo "Created Job ID: $JOB_ID"

      - name: Run Databricks Job
        run: |
          RUN_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $JOB_ID}" \
            ${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/run-now)
          
          RUN_ID=$(echo $RUN_RESPONSE | jq -r '.run_id')
          echo "run_id=$RUN_ID" >> $GITHUB_ENV
          echo "Triggered Run ID: $RUN_ID"

      - name: Wait for job completion
        run: |
          STATUS="RUNNING"
          while [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "PENDING" ]; do
            sleep 10
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
              ${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/runs/get?run_id=$RUN_ID \
              | jq -r '.state.life_cycle_state')
            echo "Current run status: $STATUS"
          done

      - name: Delete Databricks Job
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $JOB_ID}" \
            ${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/delete
          echo "Deleted Job ID: $JOB_ID"
